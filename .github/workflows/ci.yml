name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Test extension host on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Test extension host
        if: runner.os != 'Linux'
        run: npm run test:extension
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: rdl-preview-${{ runner.os }}
          path: '*.vsix'
