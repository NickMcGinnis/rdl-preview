name: Package release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: rdl-preview-vsix
          path: '*.vsix'
